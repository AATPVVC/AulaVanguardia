<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Aula Vanguardia" />
  <title>Aula Vanguardia</title>

  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="../static/css/rol.css">

  <!-- CSS de Bootstrap 5.3 (Elimina viñetas negras y aplica el diseño al menú) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Video de Fondo -->
  <video autoplay loop muted playsinline class="video-fondo">
    <source src="../static/videos/Fondo(1).mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- Navbar -->
  <nav class="navbar px-4">
    <a href="../index.html" style="display: flex; align-items: center; text-decoration: none; gap: 15px;">
      <div class="logo">
        <img src="../static/images/Gemini_Generated_Image_xp5fd9xp5fd9xp5f.png" alt="Aula Vanguardia Logo" class="logito" />
      </div>
      <h1 style="color: azure; font-size: 50px; margin: 0;">Aula Vanguardia</h1>
    </a>

    <!-- Menú Desplegable con Bootstrap -->
    <div class="dropdown" id="miDropdownContainer">
      <button class="btn btn-success dropdown-toggle rounded-pill px-4 py-2" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
        Seleccionar Opción
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
        <li>
          <a href="../index.html" onclick="home()" class="dropdown-item">Inicio</a>
        </li>
        <li>
          <a href="soluciones_es.html" onclick="solucionesEn()" class="dropdown-item">Soluciones</a>
        </li>
        <li>
          <a href="roles_es.html" onclick="rolesEn()" class="dropdown-item">Roles</a>
        </li>
        <li>
          <a href="problema_es.html" onclick="ProblematicaEn()" class="dropdown-item">Problematica</a>
        </li>
        <li>
          <a href="video.html" onclick="videoEn()" class="dropdown-item">Video</a>
        </li>
        <li>
          <a href="imagen.html" onclick="videoEn()" class="dropdown-item">Imagenes</a>
        </li>
        <li>
          <a href="roles_en.html" onclick="cambioIngles()" class="dropdown-item">Ingles</a>
        </li>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="main-container">
    <div class="team-circle" id="teamCircle">
      <button class="rotate-btn" id="rotateBtn" aria-label="Rotar personas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <button class="action-btn" id="actionBtn">ROTAR PERSONAS</button>
  </main>

  <!-- JS de Bootstrap (Indispensable para que abra y cierre al hacer clic) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Tu JS Personalizado -->
  <script src="../static/js/rol.js"></script>
</body>

</html>
